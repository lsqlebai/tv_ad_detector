services:
  web:
    build: .
    container_name: tv-ad-detector
    working_dir: /work
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./scripts:/work/scripts
      - ./input:/work/input
      - ./output:/work/output
      - ./ad_templates:/work/ad_templates
    environment:
      TZ: "${TZ:-Asia/Shanghai}"

  build_review:
    profiles: ["tools"]
    build: .
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts
      - ./input:/work/input
      - ./output:/work/output
      - ./ad_templates:/work/ad_templates
    command: python scripts/build_review.py

  cut_ads:
    profiles: ["tools"]
    build: .
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts
      - ./input:/work/input
      - ./output:/work/output
      - ./ad_templates:/work/ad_templates
    command: python scripts/cut_ads.py
